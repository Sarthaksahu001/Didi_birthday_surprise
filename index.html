<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="welcome" class="screen">
        <div class="card">
            <div class="emoji">🎁</div>

            <h1>Hey Didi! ❤️</h1>

            <p>I have a little surprise for you...</p>

            <button onclick="startSurprise()">
                Open Your Surprise ✨
            </button>
        </div>
    </div>


    <div id="birthday" class="screen hidden">

        <div id="balloons"></div>
        <div id="confetti"></div>

        <div class="birthday-card">

            <div class="cake">🎂</div>

            <h1>🎉 HAPPY BIRTHDAY 🎉</h1>

            <h2>Didi ❤️</h2>

            <p class="wish">
    Wishing you lots of happiness, love and success. ❤️<br>
    May you always keep smiling and stay happy! ✨
            </p>

            <div class="photos">

                <img src="photos/photo1.jpg" alt="Memory 1">

                <img src="photos/photo2.jpg" alt="Memory 2">

                <img src="photos/photo3.jpg" alt="Memory 3">

            </div>

            <p class="final">
                Thank you for always being there. ❤️<br>
                Stay happy, keep smiling and keep shining! ✨
            </p>

            <p class="signature">
                — Your Brother ❤️
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
